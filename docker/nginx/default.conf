server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Dish assets must only be delivered by the signed/tenant-aware API route.
    # Keep this ahead of the broader public-storage location for legacy files.
    location = /storage/dishes {
        return 404;
    }

    location ^~ /storage/dishes/ {
        return 404;
    }

    location /storage/ {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}
