<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/public

    <Directory /var/www/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Dish assets are served only by /api/assets/{asset}/file after signed or
    # same-tenant authorization. This also protects legacy public-disk files.
    <LocationMatch "^/storage/dishes(?:/|$)">
        Require all denied
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
